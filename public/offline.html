<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#fbf6ee" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1a1512" media="(prefers-color-scheme: dark)">
<title>Sem conexão - Projeto Comunidade</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;box-sizing:border-box;background:#fbf6ee;color:#2a211b;font:18px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  main{max-width:28rem}
  h1{font-size:1.6rem;margin:0 0 .5rem}
  p{margin:0 0 1.25rem}
  button{font:inherit;font-weight:700;min-height:52px;padding:0 24px;border:0;border-radius:14px;background:#2a211b;color:#ffffff;cursor:pointer}
  button:focus-visible{outline:3px solid #2a211b;outline-offset:3px}
  @media (prefers-color-scheme:dark){body{background:#1a1512;color:#f6efe6}button{background:#f6efe6;color:#1a1512}button:focus-visible{outline-color:#f6efe6}}
  @media (forced-colors:active){button{border:2px solid ButtonText}}
</style>
</head>
<body>
<main>
  <h1>Sem conexão</h1>
  <p>Este conteúdo ainda não foi guardado no aparelho. Confira a internet e tente de novo.</p>
  <button type="button" onclick="location.reload()">Tentar de novo</button>
</main>
</body>
</html>
